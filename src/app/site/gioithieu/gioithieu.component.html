                <app-breadscrumb [Breadcrumbs]="Breadcrumbs"></app-breadscrumb>
            </div>

    </div>

            <div class="flex flex-col space-y-4">
                <h2 class="!m-0">{{Gioithieu?.Title}}</h2>
                <div [innerHTML]="Gioithieu.Mota"></div>
            </div>

    <div class="container flex flex-col space-y-2 rounded-lg bg-white">
        <div class="mx-auto max-w-lg flex flex-col space-y-2 py-4">
            <h2 class="text-center text-2xl font-bold text-gray-800 pt-8">Thông Tin Liên Hệ</h2>
            <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
                <mat-label>Họ tên quý khách</mat-label>
                <input matInput  placeholder="Vui lòng Nhập Họ tên" />
            </mat-form-field> 
            <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
                <mat-label>Số điện thoại</mat-label>
                <input matInput  placeholder="Vui lòng Nhập Số điện thoại" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
                <mat-label>Email</mat-label>
                <input matInput  placeholder="Vui lòng Nhập Email" />
            </mat-form-field>         
            <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
              <mat-label>Teamplate</mat-label>
              <mat-select>
                @for (item of [{id:1,Title:'Title1'}]; track item.id) {
                  <mat-option [value]="item.id">{{item.Title}}</mat-option>
                }
              </mat-select>
            </mat-form-field>
        </div>
 
    </div>
    <div class="container flex flex-col space-y-2 rounded-lg bg-white">
        <h2 class="text-center text-2xl font-bold text-gray-800 pt-8">Bài Viết Liên Quan</h2>
        <app-swiper class="p-8" [Config]="Config" [Type]="'Gioithieu'" [slides]="ListGioithieu"/>
